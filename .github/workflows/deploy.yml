name: T-Rex Backend CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-publish:
    name: Build & Push Docker Image to GHCR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Push Docker Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          # Make sure username is lowercase
          tags: |
            ghcr.io/${{ github.repository_owner }}/trex-backend:latest
            ghcr.io/${{ github.repository_owner }}/trex-backend:${{ github.run_number }}

  deploy-to-render:
    name: Trigger Render Deployment
    runs-on: ubuntu-latest
    needs: build-and-publish
    steps:
      - name: Deploy to Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Sending deployment trigger to Render..."
            curl -X GET "$RENDER_DEPLOY_HOOK"
            echo "✅ Deployment triggered successfully!"
          else
            echo "⚠️ RENDER_DEPLOY_HOOK secret is not set in GitHub. Skipping."
          fi
